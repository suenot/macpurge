[package]
name = "macpurge-desktop"
version = "0.1.0"
description = "MacPurge Desktop App - Disk cleanup for developers"
authors = ["Evgeny <github.com/suenot>"]
edition = "2021"
license = "MIT"

[lib]
name = "macpurge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"

# Move files to the macOS Trash (reversible deletes) via NSFileManager
trash = "5"

# macOS frameworks for disk monitoring
core-foundation = "0.10"
core-foundation-sys = "0.8"

# Reuse CLI library
macpurge = { path = "../../cli" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
