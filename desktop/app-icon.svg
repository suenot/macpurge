<svg width="1024" height="1024" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="macpurge-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="macpurge-highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="m-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="105" fill="url(#macpurge-bg)" filter="url(#shadow)" />
  <rect x="24" y="24" width="464" height="464" rx="105" fill="none" stroke="url(#macpurge-highlight)" stroke-width="4" />

  <g filter="url(#shadow)">
    <path 
      d="M 140 350 L 140 220 L 256 315 L 372 220 L 372 350"
      fill="none" 
      stroke="url(#m-grad)" 
      stroke-width="48" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
  </g>

  <g filter="url(#glow)">
    <path 
      d="M 256 60 Q 256 130 326 130 Q 256 130 256 200 Q 256 130 186 130 Q 256 130 256 60 Z" 
      fill="#ffffff" 
    />
    <path 
      d="M 380 100 Q 380 120 400 120 Q 380 120 380 140 Q 380 120 360 120 Q 380 120 380 100 Z" 
      fill="#ffffff" 
      opacity="0.8"
    />
    <path 
      d="M 130 150 Q 130 165 145 165 Q 130 165 130 180 Q 130 165 115 165 Q 130 165 130 150 Z" 
      fill="#ffffff" 
      opacity="0.6"
    />
  </g>
</svg>
