[package]
name = "macpurge"
version = "0.1.0"
edition = "2021"
authors = ["Evgeny <github.com/suenot>"]
description = "CLI tool for cleaning macOS disk space"
license = "MIT"
repository = "https://github.com/suenot/macpurge"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
walkdir = "2.4"
indicatif = { version = "0.17", features = ["rayon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
colored = "2.1"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "fs", "process"] }
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
bytesize = "1.3"
rayon = "1.8"
glob = "0.3"
hostname = "0.4.2"
toml = "0.8"
which = "6.0"
zip = "2.2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "macpurge"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
